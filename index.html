<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Zeedata · Noordzee & Oostzee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg:          #080d18;
      --surface:     #0d1625;
      --surface-2:   #131f33;
      --surface-3:   #192840;
      --border:      #1c2e45;
      --border-2:    #243a56;
      --accent:      #38bdf8;
      --accent-glow: rgba(56,189,248,0.12);
      --text:        #e2e8f0;
      --text-dim:    #7a91a8;
      --text-muted:  #3d5167;
      --green:       #4ade80;
      --yellow:      #fbbf24;
      --red:         #f87171;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      height: 52px;
      padding: 0 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(14,165,233,0.3);
    }
    .brand-icon svg { width: 16px; height: 16px; color: white; }
    .brand-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: -0.01em;
    }

    .h-divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      flex-shrink: 0;
    }

    /* ── Navigatie ──────────────────────────────────────────────────────── */
    nav {
      display: flex;
      gap: 2px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 13px;
      border-radius: 5px;
      border: none;
      background: none;
      color: var(--text-dim);
      font-size: 0.78rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, background 0.15s;
    }
    .nav-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
    .nav-btn:hover  { color: var(--text); background: var(--surface-2); }
    .nav-btn.active { color: var(--accent); background: var(--surface-2); }

    /* ── Status ──────────────────────────────────────────────────────────── */
    #status {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    #status.ok      .status-dot { background: var(--green);  box-shadow: 0 0 6px rgba(74,222,128,0.5); }
    #status.loading .status-dot { background: var(--yellow); box-shadow: 0 0 6px rgba(251,191,36,0.4); }
    #status.error   .status-dot { background: var(--red);    box-shadow: 0 0 6px rgba(248,113,113,0.4); }
    #status span { color: var(--text); }

    #countdown {
      font-size: 0.7rem;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 9px;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* ── Layout ──────────────────────────────────────────────────────────── */
    #content { flex: 1; display: flex; overflow: hidden; }

    /* ── Zijbalk ─────────────────────────────────────────────────────────── */
    #sidebar {
      width: 68px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 10px 6px;
      gap: 4px;
    }

    .sidebar-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 10px 6px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.6rem;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: all 0.15s;
      user-select: none;
    }
    .sidebar-tab svg { width: 18px; height: 18px; flex-shrink: 0; }
    .sidebar-tab:hover  { background: var(--surface-2); color: var(--text-dim); border-color: var(--border); }
    .sidebar-tab.active { background: var(--accent-glow); color: var(--accent); border-color: rgba(56,189,248,0.22); }
    .sidebar-tab .tab-label { line-height: 1.2; }

    /* ── Kaartgebied ──────────────────────────────────────────────────────── */
    #main { flex: 1; display: flex; overflow: hidden; }
    #map  { flex: 1; }

    #coming-soon {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: var(--text-muted);
      background: var(--bg);
    }
    .coming-soon-icon {
      width: 56px; height: 56px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .coming-soon-icon svg { width: 28px; height: 28px; color: var(--text-muted); }
    #coming-soon-label { font-size: 0.9rem; font-weight: 600; color: var(--text-dim); }
    .coming-soon-sub   { font-size: 0.8rem; }

    /* ── Grafiekpaneel ────────────────────────────────────────────────────── */
    #chart-panel {
      width: 0;
      overflow: hidden;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }
    #chart-panel.open { width: 360px; }

    #chart-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      flex-shrink: 0;
    }
    #chart-station { flex: 1; min-width: 0; }
    #chart-naam {
      font-size: 0.9rem;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #chart-subtitle {
      font-size: 0.68rem;
      color: var(--text-dim);
      margin-top: 3px;
      font-weight: 400;
    }
    #chart-close {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.78rem;
      cursor: pointer;
      padding: 5px 9px;
      border-radius: 6px;
      line-height: 1;
      flex-shrink: 0;
      transition: all 0.15s;
      font-family: inherit;
    }
    #chart-close:hover { color: var(--text); border-color: var(--border-2); background: var(--surface-3); }

    #chart-current {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: end;
      gap: 6px;
      flex-shrink: 0;
      background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 100%);
    }
    #chart-hm0 {
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
    }
    #chart-hm0-label { font-size: 0.72rem; color: var(--text-dim); padding-bottom: 5px; font-weight: 500; }
    #chart-time { font-size: 0.68rem; color: var(--text-muted); text-align: right; padding-bottom: 5px; }

    #chart-body {
      flex: 1;
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #chart-period-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 600;
    }
    #chart-wrap { flex: 1; position: relative; min-height: 0; }
    #chart-loading {
      position: absolute; inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    /* ── Legenda ────────────────────────────────────────────────────────── */
    .legend {
      background: rgba(13,22,37,0.96);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.75rem;
      color: #94a3b8;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    .legend h4 {
      font-size: 0.65rem;
      color: var(--text-dim);
      margin-bottom: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .legend-sub {
      font-size: 0.63rem;
      color: var(--text-muted);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 9px;
      line-height: 1.8;
    }
    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
      opacity: 0.9;
    }

    /* ── Leaflet overrides ──────────────────────────────────────────────── */
    .leaflet-div-icon { background: none !important; border: none !important; }
    .leaflet-control-attribution {
      background: rgba(255,255,255,0.82) !important;
      color: #64748b !important;
      font-size: 0.62rem !important;
      backdrop-filter: blur(4px);
      border-radius: 4px 0 0 0 !important;
    }
    .leaflet-control-attribution a { color: #475569 !important; }
    .leaflet-control-zoom a {
      background: var(--surface) !important;
      color: var(--text-dim) !important;
      border-color: var(--border) !important;
    }
    .leaflet-control-zoom a:hover { background: var(--surface-2) !important; color: var(--text) !important; }

    .leaflet-popup-content-wrapper {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border-2);
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    .leaflet-popup-tip { background: var(--surface-2); }
    .leaflet-popup-close-button { color: var(--text-dim) !important; }
    .popup-naam   { font-weight: 600; font-size: 0.85rem; color: var(--accent); margin-bottom: 4px; }
    .popup-waarde { font-size: 1.5rem; font-weight: 700; margin: 4px 0; }
    .popup-meta   { font-size: 0.7rem; color: var(--text-dim); }
    .popup-tijd   { font-size: 0.67rem; color: var(--text-muted); margin-top: 2px; }
  </style>
</head>
<body>

<header>
  <!-- Branding -->
  <div class="brand">
    <div class="brand-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>
        <path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>
        <path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>
      </svg>
    </div>
    <span class="brand-name">Zeedata</span>
  </div>

  <div class="h-divider"></div>

  <nav>
    <button class="nav-btn active" id="nav-golf" onclick="selectLayer('golf')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>
        <path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>
        <path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>
      </svg>
      Golfhoogte
    </button>
    <button class="nav-btn" id="nav-temp" onclick="selectLayer('temp')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
      </svg>
      Temperatuur
    </button>
    <button class="nav-btn" id="nav-wind" onclick="selectLayer('wind')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/>
        <path d="M9.6 4.6A2 2 0 1 1 11 8H2"/>
        <path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>
      </svg>
      Windsnelheid
    </button>
    <button class="nav-btn" id="nav-zicht" onclick="selectLayer('zicht')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      Zicht
    </button>
    <button class="nav-btn" id="nav-metar" onclick="selectLayer('metar')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 15a4 4 0 0 0 4 4h9a5 5 0 0 0 1.8-9.65A7 7 0 1 0 5.3 9.4 4 4 0 0 0 3 15z"/>
      </svg>
      METAR/TAF
    </button>
    <button class="nav-btn" id="nav-bliksem" onclick="selectLayer('bliksem')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
      Bliksem
    </button>
  </nav>

  <div id="status" class="loading">
    <div class="status-dot"></div>
    <span>laden…</span>
  </div>
  <div id="countdown"></div>
</header>

<div id="content">

  <!-- ── Zijbalk ────────────────────────────────────────────────────────── -->
  <div id="sidebar">
    <div class="sidebar-tab active" id="tab-waarnemingen" onclick="selectSection('waarnemingen')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="2"/>
        <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/>
      </svg>
      <span class="tab-label">Waar&shy;nemingen</span>
    </div>
    <div class="sidebar-tab" id="tab-verwachtingen" onclick="selectSection('verwachtingen')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3v18h18"/>
        <path d="m19 9-5 5-4-4-3 3"/>
      </svg>
      <span class="tab-label">Ver&shy;wachtingen</span>
    </div>
  </div>

  <!-- ── Kaartgebied ────────────────────────────────────────────────────── -->
  <div id="main">
    <div id="map"></div>
    <div id="coming-soon">
      <div class="coming-soon-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>
        </svg>
      </div>
      <div id="coming-soon-label">Verwachtingen</div>
      <div class="coming-soon-sub">Data volgt binnenkort</div>
    </div>

    <!-- Grafiekpaneel -->
    <div id="chart-panel">
      <div id="chart-header">
        <div id="chart-station">
          <div id="chart-naam">—</div>
          <div id="chart-subtitle">Golfhoogte afgelopen 24 uur</div>
        </div>
        <button id="chart-close" title="Sluiten">✕</button>
      </div>
      <div id="chart-current">
        <div id="chart-hm0" style="color:var(--text-muted)">–</div>
        <div id="chart-hm0-label">m Hm0</div>
        <div id="chart-time">–</div>
      </div>
      <div id="chart-body">
        <div id="chart-period-label">Afgelopen 24 uur</div>
        <div id="chart-wrap">
          <div id="chart-loading">Klik op een station…</div>
          <canvas id="wave-chart" style="display:none"></canvas>
        </div>
      </div>
      <!-- METAR/TAF tekst (vervangt grafiek voor metar-tab) -->
      <div id="metar-body" style="display:none; flex:1; overflow-y:auto; padding:14px 16px 16px; flex-direction:column; gap:12px;">
        <div id="metar-loading" style="color:var(--text-muted);font-size:0.82rem;">Laden…</div>
        <div id="metar-content" style="display:none;">
          <div style="font-size:0.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.07em;font-weight:600;margin-bottom:8px;">Laatste 24 uur METARs</div>
          <div id="metar-list" style="display:flex;flex-direction:column;gap:6px;"></div>
          <div id="taf-section" style="margin-top:14px;display:none;">
            <div style="font-size:0.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.07em;font-weight:600;margin-bottom:8px;">TAF</div>
            <div id="taf-text" style="font-family:monospace;font-size:0.75rem;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;white-space:pre-wrap;word-break:break-all;line-height:1.5;"></div>
          </div>
        </div>
      </div>
    </div>
  </div><!-- #main -->
</div><!-- #content -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
// ── Kaart ────────────────────────────────────────────────────────────────────
const map = L.map('map', { center: [20, 0], zoom: 3, zoomControl: true });

map.zoomControl.setPosition('topright');

L.tileLayer('https://services.arcgisonline.com/arcgis/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution:
    '&copy; <a href="https://www.esri.com/">Esri</a>, Garmin, GEBCO, NOAA NGDC | ' +
    'Data: <a href="https://waterinfo.rws.nl">Rijkswaterstaat</a>',
  maxZoom: 17,
}).addTo(map);

L.tileLayer('https://services.arcgisonline.com/arcgis/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}', {
  attribution: '',
  maxZoom: 17,
  opacity: 0.8,
}).addTo(map);

// ── Legenda ──────────────────────────────────────────────────────────────────
const LEGEND_CONTENT = {
  golf: `
    <h4>Golfhoogte Hm0</h4>
    <div class="legend-row"><div class="legend-dot" style="background:#22c55e"></div>&lt; 0,5 m</div>
    <div class="legend-row"><div class="legend-dot" style="background:#84cc16"></div>0,5 – 1,0 m</div>
    <div class="legend-row"><div class="legend-dot" style="background:#eab308"></div>1,0 – 1,5 m</div>
    <div class="legend-row"><div class="legend-dot" style="background:#f97316"></div>1,5 – 2,5 m</div>
    <div class="legend-row"><div class="legend-dot" style="background:#ef4444"></div>2,5 – 4,0 m</div>
    <div class="legend-row"><div class="legend-dot" style="background:#7f1d1d"></div>&gt; 4,0 m</div>
    <div class="legend-sub">Bron: RWS · BSH · CEFAS</div>`,
  temp: `

// ── Kleur & icoon ─────────────────────────────────────────────────────────────
function waveColor(h) {
  if (h === null || isNaN(h)) return '#3d5167';
  if (h < 0.5)  return '#22c55e';
  if (h < 1.0)  return '#84cc16';
  if (h < 1.5)  return '#eab308';
  if (h < 2.5)  return '#f97316';
  if (h < 4.0)  return '#ef4444';
  return '#b91c1c';
}

// Schaalfactor op basis van zoomniveau
function iconScale() {
  const z = map.getZoom();
  return Math.max(0.45, Math.min(1.0, z / 7));
}

function makeIcon(h) {
  const sc    = iconScale();
  const color = waveColor(h);
  const base  = h !== null ? Math.max(34, Math.min(58, 34 + h * 7)) : 34;
  const size  = Math.round(base * sc);
  const ht    = Math.round(size * 0.58);
  const fs    = Math.max(7, Math.round(10 * sc));
  const label = h !== null ? h.toFixed(1) : '–';
  const r     = Math.max(2, Math.round(5 * sc));
  return L.divIcon({
    className:   '',
    iconSize:    [size, ht],
    iconAnchor:  [size / 2, ht / 2],
    popupAnchor: [0, -(ht / 2 + 6)],
    html: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${ht}">
      <rect x="1" y="1" width="${size-2}" height="${ht-2}" rx="${r}"
        fill="${color}" fill-opacity="0.88"/>
      <rect x="1" y="1" width="${size-2}" height="${ht-2}" rx="${r}"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="${size/2}" y="${ht/2+3.8}" text-anchor="middle"
        font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="${fs}"
        font-weight="700" fill="white">${label}</text>
    </svg>`,
  });
}

// ── Temperatuurkaart ──────────────────────────────────────────────────────────
function tempColor(t) {
  if (t === null || isNaN(t)) return '#3d5167';
  if (t < 5)  return '#93c5fd';
  if (t < 8)  return '#60a5fa';
  if (t < 11) return '#34d399';
  if (t < 14) return '#fbbf24';
  if (t < 18) return '#f97316';
  return '#ef4444';
}

function makeTempIcon(t) {
  const sc    = iconScale();
  const color = tempColor(t);
  const w = Math.round(38 * sc), ht = Math.round(22 * sc);
  const fs = Math.max(7, Math.round(10 * sc));
  const label = t !== null ? t.toFixed(1) : '–';
  return L.divIcon({
    className:   '',
    iconSize:    [w, ht],
    iconAnchor:  [w / 2, ht / 2],
    popupAnchor: [0, -(ht / 2 + 6)],
    html: `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${ht}">
      <rect x="1" y="1" width="${w-2}" height="${ht-2}" rx="${Math.max(2,Math.round(5*sc))}"
        fill="${color}" fill-opacity="0.88"/>
      <rect x="1" y="1" width="${w-2}" height="${ht-2}" rx="${Math.max(2,Math.round(5*sc))}"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="${w/2}" y="${ht/2+3.8}" text-anchor="middle"
        font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="${fs}"
        font-weight="700" fill="white">${label}</text>

  });
}

// ── Windsnelheid ──────────────────────────────────────────────────────────────

// w altijd in m/s intern; conversie + Bft alleen voor weergave
function msToBft(w) {
  if (w === null || w === undefined) return null;
  if (w < 0.3)  return 0;
  if (w < 1.6)  return 1;
  if (w < 3.4)  return 2;
  if (w < 5.5)  return 3;
  if (w < 8.0)  return 4;
  if (w < 10.8) return 5;
  if (w < 13.9) return 6;
  if (w < 17.2) return 7;
  if (w < 20.8) return 8;
  if (w < 24.5) return 9;
  if (w < 28.5) return 10;
  if (w < 32.7) return 11;
  return 12;
}
function msToKt(w) { return w !== null && w !== undefined ? w * 1.94384 : null; }

function windColor(w) {   // w in m/s
  if (w === null || isNaN(w)) return '#3d5167';
  if (w < 3.4)  return '#22c55e';   // Bft 0-2
  if (w < 5.5)  return '#84cc16';   // Bft 3
  if (w < 8.0)  return '#eab308';   // Bft 4-5
  if (w < 10.8) return '#f97316';   // Bft 6
  if (w < 13.9) return '#ef4444';   // Bft 7-8
  return '#7f1d1d';                  // Bft 9+
}

function degToCompass(deg) {
  if (deg === null || deg === undefined) return null;
  const dirs = ['N','NO','O','ZO','Z','ZW','W','NW'];
  return dirs[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
}

function makeWindIcon(w, dir) {
  const sc      = iconScale();
  const color   = windColor(w);
  const kt      = msToKt(w);
  const bft     = msToBft(w);
  const compass = degToCompass(dir);
  const hasDir  = compass !== null;

  // Hoofdtekst: bijv "17 kt"  Subtekst: "(Bft 4)"
  const speedLabel = kt !== null ? Math.round(kt) + ' kt' : '–';
  const bftLabel   = bft !== null ? `${bft} bft` : '';

  // Iets groter dan voorheen: basisblok 30px hoog, breed genoeg voor alle tekst
  const ht   = Math.round(30 * sc);
  const dirW = hasDir ? Math.round(24 * sc) : 0;
  const valW = Math.round(52 * sc);   // snelheid + bft sectie
  const ww   = dirW + valW;
  const fsMain = Math.max(8,  Math.round(11 * sc));
  const fsSub  = Math.max(6,  Math.round(8  * sc));
  const rx   = Math.max(2, Math.round(5 * sc));

  const dirSection = hasDir ? `
    <text x="${dirW / 2}" y="${ht * 0.62}" text-anchor="middle"
      font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="${fsMain}"
      font-weight="700" fill="white">${compass}</text>
    <line x1="${dirW}" y1="3" x2="${dirW}" y2="${ht - 3}"
      stroke="rgba(255,255,255,0.35)" stroke-width="1"/>` : '';

  const cx = dirW + valW / 2;
  const valSection = `
    <text x="${cx}" y="${ht * 0.50}" text-anchor="middle" dominant-baseline="middle"
      font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="${fsMain}"
      font-weight="700" fill="white">${speedLabel}</text>
    <text x="${cx}" y="${ht * 0.85}" text-anchor="middle" dominant-baseline="middle"
      font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="${fsSub}"
      font-weight="400" fill="rgba(255,255,255,0.75)">${bftLabel}</text>`;

  return L.divIcon({
    className:   '',
    iconSize:    [ww, ht],
    iconAnchor:  [ww / 2, ht / 2],
    popupAnchor: [0, -(ht / 2 + 6)],
    html: `<svg xmlns="http://www.w3.org/2000/svg" width="${ww}" height="${ht}">
      <rect x="1" y="1" width="${ww-2}" height="${ht-2}" rx="${rx}"
        fill="${color}" fill-opacity="0.88"/>
      <rect x="1" y="1" width="${ww-2}" height="${ht-2}" rx="${rx}"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      ${dirSection}${valSection}
    </svg>`,
  });
}

  if (v < 20)  return '#eab308';
  if (v < 40)  return '#84cc16';

  const ht    = Math.round(size * 0.58);

  const r     = Math.max(2, Math.round(5 * sc));
  const label = v !== null ? (v >= 10 ? Math.round(v) + ' km' : v.toFixed(1) + ' km') : '–';
  return L.divIcon({
    className: '',
    iconSize:    [size, ht],
    iconAnchor:  [size / 2, ht / 2],
    popupAnchor: [0, -(ht / 2 + 6)],
    html: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${ht}">
      <rect x="1" y="1" width="${size-2}" height="${ht-2}" rx="${r}"

const fcLabel = { VFR: 'VFR', MVFR: 'MVFR', IFR: 'IFR', LIFR: 'LIFR' };

async function openMetarPanel(icao, naam) {
  panel.classList.add('open');
  setTimeout(() => map.invalidateSize({ pan: false }), 320);

  document.getElementById('chart-naam').textContent     = naam || icao;
  document.getElementById('chart-subtitle').textContent = `METAR/TAF – ${icao}`;
  document.getElementById('chart-hm0').textContent      = icao;
  document.getElementById('chart-hm0').style.color      = 'var(--text)';
  document.getElementById('chart-hm0-label').textContent = '';
  document.getElementById('chart-time').textContent     = '';

  // Verberg grafiek, toon METAR-paneel
  document.getElementById('chart-current').style.display = 'none';
  document.getElementById('chart-body').style.display    = 'none';
  const metarBody    = document.getElementById('metar-body');
  const metarLoading = document.getElementById('metar-loading');
  const metarContent = document.getElementById('metar-content');
  metarBody.style.display    = 'flex';
  metarLoading.style.display = 'block';
  metarContent.style.display = 'none';
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  try {
    const resp = await fetch(metarDetailUrl(icao), { cache: 'no-store' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const json = await resp.json();

    // METARs
    const listEl = document.getElementById('metar-list');
    listEl.innerHTML = '';
    if (!json.metars || json.metars.length === 0) {
      listEl.innerHTML = '<div style="color:var(--text-muted);font-size:0.8rem;">Geen recente METARs beschikbaar.</div>';
    } else {
      json.metars.forEach(m => {
        const color = metarColor(m.fc);
        const time  = m.time ? new Date(m.time).toLocaleString('nl-NL', {
          day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit',
          timeZone: 'UTC',
        }) + ' UTC' : '';
        const div = document.createElement('div');
        div.style.cssText = 'background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;';
        div.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
            <span style="font-size:0.68rem;color:${color};font-weight:700;">${m.fc || '?'}</span>
            <span style="font-size:0.65rem;color:var(--text-muted);">${time}</span>
          </div>
          <div style="font-family:monospace;font-size:0.72rem;color:var(--text);white-space:pre-wrap;word-break:break-all;line-height:1.5;">${m.raw}</div>`;
        listEl.appendChild(div);
      });
    }

    // TAF
    const tafSection = document.getElementById('taf-section');
    const tafText    = document.getElementById('taf-text');
    if (json.taf) {
      tafText.textContent    = json.taf;
      tafSection.style.display = 'block';
    } else {
      tafSection.style.display = 'none';
    }

    metarLoading.style.display = 'none';
    metarContent.style.display = 'block';
  } catch (err) {
    console.error(err);
    metarLoading.textContent = 'Fout bij laden: ' + err.message;
  }
}

async function fetchMetarData() {
  setStatus('loading', 'laden…');

// ── Bliksem (directe browser WebSocket naar Blitzortung) ─────────────────────
const BLIKSEM_MAX_AGE_MS = 30 * 60 * 1000;

let _bliksemLayers  = [];
let _bliksemWs      = null;
let _bliksemColorT  = null;
let _bliksemReconT  = null;
let _bliksemKnownTs = new Set();

const _bliksemRenderer = L.canvas({ padding: 0.5 });

function _bliksemColor(ageMs) {
  if (ageMs <   60000) return '#ff2222';
  if (ageMs <  300000) return '#ff8800';
  if (ageMs <  900000) return '#ffdd00';
  return '#666666';
}
function _bliksemRadius(ageMs) {
  if (ageMs <  60000) return 6;
  if (ageMs < 300000) return 4;
  return 3;
}
function _bliksemOpacity(ageMs) {
  if (ageMs <  60000) return 0.95;
  if (ageMs < 300000) return 0.80;
  if (ageMs < 900000) return 0.55;
  return 0.30;
}

function clearBliksemMarkers() {
  _bliksemLayers.forEach(m => map.removeLayer(m));
  _bliksemLayers = [];
  _bliksemKnownTs.clear();
}

function _bliksemAddStrike(lat, lon, tsMs) {
  if (_bliksemKnownTs.has(tsMs)) return;
  _bliksemKnownTs.add(tsMs);
  const ageMs = Date.now() - tsMs;
  if (ageMs > BLIKSEM_MAX_AGE_MS || ageMs < -5000) return;
  const m = L.circleMarker([lat, lon], {
    renderer:    _bliksemRenderer,
    radius:      _bliksemRadius(ageMs),
    color:       _bliksemColor(ageMs),
    fillColor:   _bliksemColor(ageMs),
    fillOpacity: _bliksemOpacity(ageMs),
    weight:      0,
    _tsMs:       tsMs,
  }).addTo(map);
  _bliksemLayers.push(m);
  if (activeLayer === 'bliksem') {
    setStatus('ok', `${_bliksemLayers.length} bliksems · laatste 30 min`);
  }
}

function _bliksemRefreshColors() {
  if (activeLayer !== 'bliksem') return;
  const now    = Date.now();
  const cutoff = now - BLIKSEM_MAX_AGE_MS;
  const old = _bliksemLayers.filter(m => m.options._tsMs < cutoff);
  old.forEach(m => { map.removeLayer(m); _bliksemKnownTs.delete(m.options._tsMs); });
  _bliksemLayers = _bliksemLayers.filter(m => m.options._tsMs >= cutoff);
  _bliksemLayers.forEach(m => {
    const age = now - m.options._tsMs;
    const c   = _bliksemColor(age);
    m.setStyle({ color: c, fillColor: c, fillOpacity: _bliksemOpacity(age), radius: _bliksemRadius(age) });
  });
  setStatus('ok', `${_bliksemLayers.length} bliksems · laatste 30 min`);
}

// Blitzortung servers: ws1+ws2 hebben geldige SSL certs, rest niet
const _BLITZ_SERVERS = ['ws1.blitzortung.org', 'ws2.blitzortung.org'];
let _bliksemServerIdx = 0;

function _bliksemConnect() {
  if (_bliksemWs && _bliksemWs.readyState <= 1) return;
  const host = _BLITZ_SERVERS[_bliksemServerIdx % _BLITZ_SERVERS.length];
  // GEEN subprotocol — Blitzortung accepteert alleen plain WebSocket
  try {
    const ws = new WebSocket(`wss://${host}`);
    _bliksemWs = ws;

    ws.onopen = () => {
      console.log(`[bliksem] verbonden ${host}, subprotocol="${ws.protocol}"`);
      // Stuur subscriptie voor wereldwijd bereik
      ws.send(JSON.stringify({ west: -180, east: 180, north: 90, south: -90 }));
      setStatus('ok', 'Verbonden · wacht op bliksems…');
    };

    ws.onmessage = (evt) => {
      const raw = typeof evt.data === 'string' ? evt.data : null;
      if (!raw || raw[0] !== '{') return;
      let d;
      try { d = JSON.parse(raw); } catch { return; }
      if (d.lat === undefined || d.lon === undefined) return;

      // Timestamp is nanoseconden (19 cijfers) — regex op raw string bewaard precisie
      const tm = raw.match(/"time"\s*:\s*(\d{13,19})/);
      const tsMs = tm ? parseInt(tm[1].slice(0, 13), 10) : Date.now();
      _bliksemAddStrike(d.lat, d.lon, tsMs);
    };

    ws.onerror = () => console.warn(`[bliksem] ${host} verbindingsfout`);

    ws.onclose = (e) => {
      console.log(`[bliksem] ${host} gesloten (code ${e.code})`);
      _bliksemWs = null;
      // Roteer naar volgende server bij herverbinden
      _bliksemServerIdx++;
      if (activeLayer === 'bliksem') {
        _bliksemReconT = setTimeout(_bliksemConnect, 3000);
      }
    };
  } catch (e) {
    console.warn('[bliksem] WS aanmaken mislukt:', e);
  }
}

function startBliksem() {
  clearMarkers(); clearTempMarkers(); clearWindMarkers(); clearZichtMarkers(); clearMetarMarkers();
  clearBliksemMarkers();
  setStatus('loading', 'Verbinden met bliksemnetwerk…');
  _bliksemConnect();
  _bliksemColorT = setInterval(_bliksemRefreshColors, 15000);
}

function stopBliksem() {
  if (_bliksemColorT) { clearInterval(_bliksemColorT); _bliksemColorT = null; }
  if (_bliksemReconT) { clearTimeout(_bliksemReconT);  _bliksemReconT = null; }
  if (_bliksemWs) { _bliksemWs.onclose = null; _bliksemWs.close(); _bliksemWs = null; }
  clearBliksemMarkers();
}

        day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit',

    opts.scales.y.suggestedMax     = Math.max(maxVal * 1.1, 10);

async function openWindChart(code, naam, huidigWind, tijdstip) {
  _restoreChartPanel();
  panel.classList.add('open');
  setTimeout(() => map.invalidateSize({ pan: false }), 320);

  document.getElementById('chart-naam').textContent      = naam || code;
  document.getElementById('chart-subtitle').textContent  = 'Windsnelheid afgelopen 24 uur';
  document.getElementById('chart-hm0-label').textContent = 'kt';
  const color = windColor(huidigWind);
  const huidigKt = msToKt(huidigWind);
  const huidigBft = msToBft(huidigWind);
  document.getElementById('chart-hm0').textContent  = huidigKt !== null ? `${Math.round(huidigKt)} kt (Bft ${huidigBft})` : '–';
  document.getElementById('chart-hm0').style.color  = color;
  document.getElementById('chart-time').textContent = formatTijdstip(tijdstip);

  loadingEl.textContent   = 'Geschiedenis laden…';
  loadingEl.style.display = 'flex';
  canvasEl.style.display  = 'none';
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  try {
    const resp = await fetch(windHistoryUrl(code), { cache: 'no-store' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const json = await resp.json();
    if (!json.data || json.data.length === 0) {
      loadingEl.textContent = 'Geen historische data beschikbaar.';
      return;
    }
    loadingEl.style.display = 'none';
    canvasEl.style.display  = 'block';

    const labels = json.data.map(d => new Date(d.t));
    const values = json.data.map(d => Math.round(msToKt(d.v) * 10) / 10);  // m/s → kt
    const maxVal = Math.max(...values);

    // Windrichting dataset (rechter as)
    const dirPoints = (json.dir_data || []).map(d => ({ x: new Date(d.t), y: d.v }));
    const dirColor  = 'rgba(148,163,184,0.85)';

    const opts = CHART_OPTS(color);
    opts.plugins.tooltip.callbacks = {
      title: items => new Date(items[0].parsed.x).toLocaleString('nl-NL', {
        day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit',
        timeZone: 'Europe/Amsterdam',
      }),
      label: item => {
        if (item.dataset.yAxisID === 'yDir') {
          const deg = item.parsed.y;
          const dirs = ['N','NO','O','ZO','Z','ZW','W','NW'];
          const compass = dirs[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
          return ` ${compass} (${deg}°)`;
        }
        const kt = item.parsed.y;
        const bft = msToBft(kt / 1.94384);
        return ` ${kt.toFixed(1)} kt (Bft ${bft})`;
      },
    };
    opts.scales.y.min             = 0;
    opts.scales.y.suggestedMax    = Math.max(maxVal * 1.2, 10);
    opts.scales.y.ticks.callback  = v => Math.round(v) + ' kt';

    // Rechter as voor windrichting (0–360°)
    opts.scales.yDir = {
      type: 'linear',
      position: 'right',
      min: 0, max: 360,
      grid: { drawOnChartArea: false },
      ticks: {
        color: dirColor,
        font: { size: 10 },
        stepSize: 90,
        callback: v => ({ 0:'N', 90:'O', 180:'Z', 270:'W', 360:'N' }[v] ?? ''),
      },
      border: { color: dirColor },
    };

    const datasets = [{
      label: 'Windsnelheid',
      yAxisID: 'y',
      data: values, borderColor: color,
      backgroundColor: color + '18',
      borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,
      fill: true, tension: 0.35,
    }];
    if (dirPoints.length > 0) {
      datasets.push({
        label: 'Windrichting',
        yAxisID: 'yDir',
        data: dirPoints,
        borderColor: dirColor,
        backgroundColor: 'transparent',
        borderWidth: 1.5,
        pointRadius: 0, pointHoverRadius: 3,
        fill: false, tension: 0.2,
        parsing: false,
      });
    }

    chartInstance = new Chart(canvasEl, {
      type: 'line',
      data: { labels, datasets },
      options: opts,
    });
  } catch (err) {
    console.error(err);
    loadingEl.textContent = 'Fout bij laden: ' + err.message;
  }
}

function selectLayer(layer) {
  if (layer === activeLayer) return;
  stopCountdown();
  activeLayer = layer;

  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`nav-${layer}`).classList.add('active');
  updateLegend(layer);

  const mapEl      = document.getElementById('map');
  const comingSoon = document.getElementById('coming-soon');

  if (layer === 'golf') {
    mapEl.style.display      = '';
    comingSoon.style.display = 'none';
    if (_lastWaveGeoJSON && _isFresh('golf')) { renderMarkers(_lastWaveGeoJSON); startCountdown(); }
    else fetchWaveData().then(startCountdown);
  } else if (layer === 'temp') {
    mapEl.style.display      = '';
    comingSoon.style.display = 'none';
    if (_lastTempGeoJSON && _isFresh('temp')) { renderTempMarkers(_lastTempGeoJSON); startCountdown(); }
    else fetchTempData().then(startCountdown);
  } else if (layer === 'wind') {
    mapEl.style.display      = '';
    comingSoon.style.display = 'none';
    if (_lastWindGeoJSON && _isFresh('wind')) { renderWindMarkers(_lastWindGeoJSON); startCountdown(); }
    else fetchWindData().then(startCountdown);
  } else if (layer === 'zicht') {
    mapEl.style.display      = '';
    comingSoon.style.display = 'none';
    if (_lastZichtGeoJSON && _isFresh('zicht')) { renderZichtMarkers(_lastZichtGeoJSON); startCountdown(); }
    else fetchZichtData().then(startCountdown);
  } else if (layer === 'metar') {
    mapEl.style.display      = '';
    comingSoon.style.display = 'none';
    if (_lastMetarGeoJSON && _isFresh('metar')) { renderMetarMarkers(_lastMetarGeoJSON); startCountdown(); }
    else fetchMetarData().then(startCountdown);
  } else if (layer === 'bliksem') {
    mapEl.style.display      = '';
    comingSoon.style.display = 'none';
    startBliksem();
  } else {
    mapEl.style.display      = 'none';
    comingSoon.style.display = 'flex';
    document.getElementById('coming-soon-label').textContent = layer;
    setStatus('', '–');
    document.getElementById('status').className = '';
    document.getElementById('countdown').textContent = '';
  }
}

    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit',

  _lastWaveGeoJSON = geojson;
  clearMarkers(); clearTempMarkers(); clearWindMarkers(); clearZichtMarkers(); clearMetarMarkers(); stopBliksem();

async function fetchWithTimeout(url, timeoutMs = 90000) {
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const resp = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
    return resp;
  } finally {
    clearTimeout(tid);
  }
}

  document.getElementById('chart-time').textContent = formatTijdstip(tijdstip);

  loadingEl.textContent   = 'Geschiedenis laden…';
  loadingEl.style.display = 'flex';
  canvasEl.style.display  = 'none';
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  try {
    const resp = await fetch(historyUrl(code), { cache: 'no-store' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const json = await resp.json();
    if (!json.data || json.data.length === 0) {
      loadingEl.textContent = 'Geen historische data beschikbaar.';
      return;
    }

    loadingEl.style.display = 'none';
    canvasEl.style.display  = 'block';

    const labels = json.data.map(d => new Date(d.t));
    const values = json.data.map(d => d.v);
    const maxVal = Math.max(...values);

    const opts = CHART_OPTS(color);
    opts.plugins.tooltip.callbacks = {
      title: items => new Date(items[0].parsed.x).toLocaleString('nl-NL', {
        day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit',
        timeZone: 'Europe/Amsterdam',
      }),
      label: item => ` ${item.parsed.y.toFixed(2)} m`,
    };
    opts.scales.y.min          = 0;
    opts.scales.y.suggestedMax = Math.max(maxVal * 1.2, 0.5);
    opts.scales.y.ticks.callback = v => v.toFixed(1) + ' m';

    chartInstance = new Chart(canvasEl, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: values, borderColor: color,
          backgroundColor: color + '18',
          borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,
          fill: true, tension: 0.35,
        }],
      },
      options: opts,
    });

  } catch (err) {
    console.error(err);
    loadingEl.textContent = 'Fout bij laden: ' + err.message;
  }
}

async function openTempChart(code, naam, huidigTemp, tijdstip) {
  _restoreChartPanel();
  panel.classList.add('open');

  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  try {
    const resp = await fetch(tempHistoryUrl(code), { cache: 'no-store' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const json = await resp.json();
    if (!json.data || json.data.length === 0) {
      loadingEl.textContent = 'Geen historische data beschikbaar.';
      return;
    }

    loadingEl.style.display = 'none';
    canvasEl.style.display  = 'block';

    const labels = json.data.map(d => new Date(d.t));
    const values = json.data.map(d => d.v);
    const minVal = Math.min(...values);
    const maxVal = Math.max(...values);

    const opts = CHART_OPTS(color);
    opts.plugins.tooltip.callbacks = {
      title: items => new Date(items[0].parsed.x).toLocaleString('nl-NL', {
        day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit',
        timeZone: 'Europe/Amsterdam',
      }),
      label: item => ` ${item.parsed.y.toFixed(1)} °C`,
    };
    opts.scales.y.suggestedMin  = Math.max(0, minVal - 1);
    opts.scales.y.suggestedMax  = maxVal + 1;
    opts.scales.y.ticks.callback = v => v.toFixed(1) + ' °C';

    chartInstance = new Chart(canvasEl, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: values, borderColor: color,
          backgroundColor: color + '18',
          borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,

        }],
      },
      options: opts,
    });

  } catch (err) {
    console.error(err);
    loadingEl.textContent = 'Fout bij laden: ' + err.message;
  }
}

// ── Status & countdown ────────────────────────────────────────────────────────
function setStatus(state, text) {
  const el = document.getElementById('status');
  el.className = state;
  el.innerHTML = `<div class="status-dot"></div><span>${text}</span>`;
}

const UPDATE_SEC = 10 * 60;
let secondsLeft  = 0;
let _countdownTid = null;

// ── Tab-datacache: sla fetchtijd op per laag ──────────────────────────────────
const _layerFetchedAt = {};
const _CACHE_FRESH_MS = 5 * 60 * 1000; // 5 minuten

function _isFresh(layer) {
  return (_layerFetchedAt[layer] || 0) + _CACHE_FRESH_MS > Date.now();
}

function _markFetched(layer) {
  _layerFetchedAt[layer] = Date.now();
}

// ── Keep-alive ping (voorkomt slaapstand op Render free tier) ─────────────────
if (!LOCAL) {
  setInterval(() => fetch(`${PROXY_URL}/api/ping`, { cache: 'no-store' }).catch(() => {}), 9 * 60 * 1000);
}

function stopCountdown() {
  if (_countdownTid) { clearInterval(_countdownTid); _countdownTid = null; }
  document.getElementById('countdown').textContent = '';
}

function startCountdown() {
  stopCountdown();
  secondsLeft = UPDATE_SEC;
  const el = document.getElementById('countdown');
  _countdownTid = setInterval(() => {
    secondsLeft--;
    if (secondsLeft <= 0) {
      stopCountdown();
      const fetchFn = activeLayer === 'temp'  ? fetchTempData
                    : activeLayer === 'wind'  ? fetchWindData
                    : activeLayer === 'zicht' ? fetchZichtData
                    : activeLayer === 'metar' ? fetchMetarData
                    : fetchWaveData;
      fetchFn().then(startCountdown);
    } else {
      const m = Math.floor(secondsLeft / 60);
      const s = secondsLeft % 60;
      el.textContent = `${m}:${String(s).padStart(2, '0')}`;
    }
  }, 1000);
}

// ── Start ─────────────────────────────────────────────────────────────────────
fetchWaveData().then(startCountdown);
</script>
