<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Zeedata · Noordzee & Oostzee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg:          #080d18;
      --surface:     #0d1625;
      --surface-2:   #131f33;
      --surface-3:   #192840;
      --border:      #1c2e45;
      --border-2:    #243a56;
      --accent:      #38bdf8;
      --accent-glow: rgba(56,189,248,0.12);
      --text:        #e2e8f0;
      --text-dim:    #7a91a8;
      --text-muted:  #3d5167;
      --green:       #4ade80;
      --yellow:      #fbbf24;
      --red:         #f87171;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      height: 52px;
      padding: 0 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(14,165,233,0.3);
    }
    .brand-icon svg { width: 16px; height: 16px; color: white; }
    .brand-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: -0.01em;
    }

    .h-divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      flex-shrink: 0;
    }

    /* ── Navigatie ──────────────────────────────────────────────────────── */
    nav {
      display: flex;
      gap: 2px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 13px;
      border-radius: 5px;
      border: none;
      background: none;
      color: var(--text-dim);
      font-size: 0.78rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, background 0.15s;
    }
    .nav-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
    .nav-btn:hover  { color: var(--text); background: var(--surface-2); }
    .nav-btn.active { color: var(--accent); background: var(--surface-2); }

    /* ── Status ──────────────────────────────────────────────────────────── */
    #status {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    #status.ok      .status-dot { background: var(--green);  box-shadow: 0 0 6px rgba(74,222,128,0.5); }
    #status.loading .status-dot { background: var(--yellow); box-shadow: 0 0 6px rgba(251,191,36,0.4); }
    #status.error   .status-dot { background: var(--red);    box-shadow: 0 0 6px rgba(248,113,113,0.4); }
    #status span { color: var(--text); }

    #countdown {
      font-size: 0.7rem;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 9px;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* ── Layout ──────────────────────────────────────────────────────────── */
    #content { flex: 1; display: flex; overflow: hidden; }

    /* ── Zijbalk ─────────────────────────────────────────────────────────── */
    #sidebar {
      width: 68px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 10px 6px;
      gap: 4px;
    }

    .sidebar-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 10px 6px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.6rem;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: all 0.15s;
      user-select: none;
    }
    .sidebar-tab svg { width: 18px; height: 18px; flex-shrink: 0; }
    .sidebar-tab:hover  { background: var(--surface-2); color: var(--text-dim); border-color: var(--border); }
    .sidebar-tab.active { background: var(--accent-glow); color: var(--accent); border-color: rgba(56,189,248,0.22); }
    .sidebar-tab .tab-label { line-height: 1.2; }

    /* ── Kaartgebied ──────────────────────────────────────────────────────── */
    #main { flex: 1; display: flex; overflow: hidden; }
    #map  { flex: 1; }

    /* ── Radarpaneel ─────────────────────────────────────────────────────── */
    #radar-panel {
      display: none;
      flex: 1;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }
    #radar-panel.active { display: flex; }

    #radar-map {
      flex: 1;
      min-height: 0;
    }

    #radar-controls {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #radar-play {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    #radar-play:hover { background: #7dd3fc; }
    #radar-play svg { width: 16px; height: 16px; fill: #0c1a2b; }

    #radar-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: var(--border-2);
      outline: none;
      cursor: pointer;
    }
    #radar-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }
    #radar-slider::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
    }

    #radar-time {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      min-width: 42px;
      text-align: right;
    }

    #radar-source {
      font-size: 0.62rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .radar-src-btn {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-2);
      background: var(--surface-2);
      color: var(--text-dim);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .radar-src-btn.active {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: var(--accent);
    }
    .radar-src-btn:hover:not(.active) {
      background: var(--surface-3);
      color: var(--text);
    }

    /* Voorkom blauwe placeholder tijdens laden van radar-image */
    #radar-map img { background: transparent !important; }

    /* Soepele overgang tussen radarframes */
    .rv-radar-frame { transition: opacity 0.2s ease; }

    /* Radar legenda (Leaflet control) */
    .radar-legend {
      background: rgba(13,22,37,0.88);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.72rem;
      color: var(--text);
      line-height: 1.6;
      backdrop-filter: blur(4px);
    }
    .radar-legend h4 {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-dim);
      margin-bottom: 7px;
    }
    .radar-legend-row {
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }
    .radar-legend-swatch {
      width: 12px; height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.15);
    }


    #coming-soon {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: var(--text-muted);
      background: var(--bg);
    }
    .coming-soon-icon {
      width: 56px; height: 56px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .coming-soon-icon svg { width: 28px; height: 28px; color: var(--text-muted); }
    #coming-soon-label { font-size: 0.9rem; font-weight: 600; color: var(--text-dim); }
    .coming-soon-sub   { font-size: 0.8rem; }

    /* ── Grafiekpaneel ────────────────────────────────────────────────────── */
    #chart-panel {
      width: 0;
      overflow: hidden;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }
    #chart-panel.open { width: 360px; }

    #chart-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      flex-shrink: 0;
    }
    #chart-station { flex: 1; min-width: 0; }
    #chart-naam {
      font-size: 0.9rem;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #chart-subtitle {
      font-size: 0.68rem;
      color: var(--text-dim);
      margin-top: 3px;
      font-weight: 400;
    }
    #chart-close {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.78rem;
      cursor: pointer;
      padding: 5px 9px;
      border-radius: 6px;
      line-height: 1;
      flex-shrink: 0;
      transition: all 0.15s;
      font-family: inherit;
    }
    #chart-close:hover { color: var(--text); border-color: var(--border-2); background: var(--surface-3); }

    #chart-current {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: end;
      gap: 6px;
      flex-shrink: 0;
      background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 100%);
    }
    #chart-hm0 {
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
    }
    #chart-hm0-label { font-size: 0.72rem; color: var(--text-dim); padding-bottom: 5px; font-weight: 500; }
    #chart-time { font-size: 0.68rem; color: var(--text-muted); text-align: right; padding-bottom: 5px; }

    #chart-body {
      flex: 1;
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #chart-period-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 600;
    }
    #chart-wrap { flex: 1; position: relative; min-height: 0; }
    #chart-loading {
      position: absolute; inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    /* ── Legenda ────────────────────────────────────────────────────────── */
    .legend {
      background: rgba(13,22,37,0.96);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.75rem;
      color: #94a3b8;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    .legend h4 {
      font-size: 0.65rem;
      color: var(--text-dim);
      margin-bottom: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .legend-sub {
      font-size: 0.63rem;
      color: var(--text-muted);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    /* Bliksem flash — eenmalige puls bij nieuw strike */
    @keyframes bliksem-flash {
      0%   { transform: scale(0.5); opacity: 1;   box-shadow: 0 0 6px 3px rgba(255,255,255,0.8); }
      40%  { transform: scale(1.4); opacity: 0.9; box-shadow: 0 0 4px 2px rgba(255,221,0,0.5); }
      100% { transform: scale(4.0); opacity: 0;   box-shadow: none; }
    }
    .bliksem-flash {
      width:  22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      background: rgba(255,221,0,0.25);
      animation: bliksem-flash 1.0s ease-out forwards;
      pointer-events: none;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 9px;
      line-height: 1.8;
    }
    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
      opacity: 0.9;
    }

    /* ── Leaflet overrides ──────────────────────────────────────────────── */
    .leaflet-div-icon { background: none !important; border: none !important; }
    .leaflet-control-attribution {
      background: rgba(255,255,255,0.82) !important;
      color: #64748b !important;
      font-size: 0.62rem !important;
      backdrop-filter: blur(4px);
      border-radius: 4px 0 0 0 !important;
    }
    .leaflet-control-attribution a { color: #475569 !important; }
    .leaflet-control-zoom a {
      background: var(--surface) !important;
      color: var(--text-dim) !important;
      border-color: var(--border) !important;
    }
    .leaflet-control-zoom a:hover { background: var(--surface-2) !important; color: var(--text) !important; }

    .leaflet-popup-content-wrapper {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border-2);
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    .leaflet-popup-tip { background: var(--surface-2); }
    .leaflet-popup-close-button { color: var(--text-dim) !important; }
    .popup-naam   { font-weight: 600; font-size: 0.85rem; color: var(--accent); margin-bottom: 4px; }
    .popup-waarde { font-size: 1.5rem; font-weight: 700; margin: 4px 0; }
    .popup-meta   { font-size: 0.7rem; color: var(--text-dim); }
    .popup-tijd   { font-size: 0.67rem; color: var(--text-muted); margin-top: 2px; }
  </style>
</head>
<body>

<header>
  <!-- Branding -->
  <div class="brand">
    <div class="brand-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>
        <path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>
        <path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>
      </svg>
    </div>
    <span class="brand-name">Zeedata</span>
  </div>

  <div class="h-divider"></div>

  <nav>
    <button class="nav-btn active" id="nav-golf" onclick="selectLayer('golf')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>
        <path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>
        <path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>
      </svg>
      Golfhoogte
    </button>
    <button class="nav-btn" id="nav-temp" onclick="selectLayer('temp')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
      </svg>
      Zeewatertemperatuur
    </button>
    <button class="nav-btn" id="nav-wind" onclick="selectLayer('wind')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/>
        <path d="M9.6 4.6A2 2 0 1 1 11 8H2"/>
        <path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>
      </svg>
      Windsnelheid
    </button>
    <button class="nav-btn" id="nav-zicht" onclick="selectLayer('zicht')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      Zicht
    </button>
    <button class="nav-btn" id="nav-metar" onclick="selectLayer('metar')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 15a4 4 0 0 0 4 4h9a5 5 0 0 0 1.8-9.65A7 7 0 1 0 5.3 9.4 4 4 0 0 0 3 15z"/>
      </svg>
      METAR/TAF
    </button>
    <button class="nav-btn" id="nav-bliksem" onclick="selectLayer('bliksem')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
      Bliksem
    </button>
    <button class="nav-btn" id="nav-radar" onclick="selectLayer('radar')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="2"/>
        <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/>
      </svg>
      Radar Europa
    </button>
  </nav>

  <div id="status" class="loading">
    <div class="status-dot"></div>
    <span>laden…</span>
  </div>
  <div id="countdown"></div>
</header>

<div id="content">

  <!-- ── Zijbalk ────────────────────────────────────────────────────────── -->
  <div id="sidebar">
    <div class="sidebar-tab active" id="tab-waarnemingen" onclick="selectSection('waarnemingen')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="2"/>
        <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/>
      </svg>
      <span class="tab-label">Waar&shy;nemingen</span>
    </div>
    <div class="sidebar-tab" id="tab-verwachtingen" onclick="selectSection('verwachtingen')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3v18h18"/>
        <path d="m19 9-5 5-4-4-3 3"/>
      </svg>
      <span class="tab-label">Ver&shy;wachtingen</span>

<script>
// ── Kaart ────────────────────────────────────────────────────────────────────
const map = L.map('map', { center: [20, 0], zoom: 3, zoomControl: true });

map.zoomControl.setPosition('topright');

L.tileLayer('https://services.arcgisonline.com/arcgis/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', {

L.tileLayer('https://services.arcgisonline.com/arcgis/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}', {

// ── Legenda ──────────────────────────────────────────────────────────────────
const LEGEND_CONTENT = {

  temp: `
    <h4>Zeewatertemperatuur</h4>
    <div class="legend-row"><div class="legend-dot" style="background:#93c5fd"></div>&lt; 5 °C</div>
    <div class="legend-row"><div class="legend-dot" style="background:#60a5fa"></div>5 – 8 °C</div>
    <div class="legend-row"><div class="legend-dot" style="background:#34d399"></div>8 – 11 °C</div>
    <div class="legend-row"><div class="legend-dot" style="background:#fbbf24"></div>11 – 14 °C</div>
    <div class="legend-row"><div class="legend-dot" style="background:#f97316"></div>14 – 18 °C</div>
    <div class="legend-row"><div class="legend-dot" style="background:#ef4444"></div>&gt; 18 °C</div>
    <div class="legend-sub">Bron: RWS · CEFAS</div>`,
  wind: `
    <h4>Windsnelheid (m/s)</h4>
    <div class="legend-row"><div class="legend-dot" style="background:#22c55e"></div>&lt; 3,4 m/s &nbsp;<span style="color:var(--text-muted);font-size:0.62rem">Bft 0–1</span></div>
    <div class="legend-row"><div class="legend-dot" style="background:#84cc16"></div>3,4 – 5,5 m/s &nbsp;<span style="color:var(--text-muted);font-size:0.62rem">Bft 2–3</span></div>
    <div class="legend-row"><div class="legend-dot" style="background:#eab308"></div>5,5 – 8,0 m/s &nbsp;<span style="color:var(--text-muted);font-size:0.62rem">Bft 4–5</span></div>
    <div class="legend-row"><div class="legend-dot" style="background:#f97316"></div>8,0 – 10,8 m/s &nbsp;<span style="color:var(--text-muted);font-size:0.62rem">Bft 6–7</span></div>
    <div class="legend-row"><div class="legend-dot" style="background:#ef4444"></div>10,8 – 13,9 m/s &nbsp;<span style="color:var(--text-muted);font-size:0.62rem">Bft 8</span></div>
    <div class="legend-row"><div class="legend-dot" style="background:#7f1d1d"></div>&gt; 13,9 m/s &nbsp;<span style="color:var(--text-muted);font-size:0.62rem">Bft 9+</span></div>
    <div class="legend-sub">Bron: RWS</div>`,
  zicht: `
    <h4>Zicht (km)</h4>
    <div class="legend-row"><div class="legend-dot" style="background:#7f1d1d"></div>&lt; 1 km &nbsp;<span style="color:var(--text-muted);font-size:0.62rem">Mist</span></div>
    <div class="legend-row"><div class="legend-dot" style="background:#ef4444"></div>1 – 4 km &nbsp;<span style="color:var(--text-muted);font-size:0.62rem">Slecht</span></div>
    <div class="legend-row"><div class="legend-dot" style="background:#f97316"></div>4 – 10 km &nbsp;<span style="color:var(--text-muted);font-size:0.62rem">Matig</span></div>
    <div class="legend-row"><div class="legend-dot" style="background:#eab308"></div>10 – 20 km &nbsp;<span style="color:var(--text-muted);font-size:0.62rem">Redelijk</span></div>
    <div class="legend-row"><div class="legend-dot" style="background:#84cc16"></div>20 – 40 km &nbsp;<span style="color:var(--text-muted);font-size:0.62rem">Goed</span></div>
    <div class="legend-row"><div class="legend-dot" style="background:#22c55e"></div>&gt; 40 km &nbsp;<span style="color:var(--text-muted);font-size:0.62rem">Uitstekend</span></div>
    <div class="legend-sub">Bron: KNMI</div>`,
  metar: `
    <h4>METAR/TAF</h4>
    <div class="legend-row"><div class="legend-dot" style="background:#22c55e"></div>VFR &nbsp;<span style="color:var(--text-muted);font-size:0.62rem">Zicht &gt; 5 km, Wolken &gt; 3000 ft</span></div>
    <div class="legend-row"><div class="legend-dot" style="background:#60a5fa"></div>MVFR &nbsp;<span style="color:var(--text-muted);font-size:0.62rem">3–5 km, 1000–3000 ft</span></div>
    <div class="legend-row"><div class="legend-dot" style="background:#ef4444"></div>IFR &nbsp;<span style="color:var(--text-muted);font-size:0.62rem">1,6–3 km, 500–1000 ft</span></div>
    <div class="legend-row"><div class="legend-dot" style="background:#a855f7"></div>LIFR &nbsp;<span style="color:var(--text-muted);font-size:0.62rem">&lt; 1,6 km / &lt; 500 ft</span></div>
    <div class="legend-row"><div class="legend-dot" style="background:#64748b"></div>Onbekend</div>
    <div class="legend-sub">Bron: aviationweather.gov · Kust (elev ≤ 10m)</div>`,
  bliksem: `
    <h4>Bliksem (realtime)</h4>
    <div class="legend-row"><div class="legend-dot" style="background:#ffdd00"></div>&lt; 5 min</div>
    <div class="legend-row"><div class="legend-dot" style="background:#ff8800"></div>5 – 15 min</div>
    <div class="legend-row"><div class="legend-dot" style="background:#ef4444"></div>15 – 30 min</div>
    <div class="legend-row"><div class="legend-dot" style="background:#666666"></div>30 – 60 min</div>
    <div class="legend-sub">Bron: Blitzortung.org · Wereldwijd</div>`,
};

let legendEl = null;
const legend = L.control({ position: 'bottomright' });
legend.onAdd = () => {
  legendEl = L.DomUtil.create('div', 'legend');
  legendEl.innerHTML = LEGEND_CONTENT.golf;
  return legendEl;
};
legend.addTo(map);

function updateLegend(layer) {
  if (legendEl && LEGEND_CONTENT[layer]) {
    legendEl.innerHTML = LEGEND_CONTENT[layer];
    legendEl.style.display = '';
  } else if (legendEl) {
    legendEl.style.display = 'none';
  }
}

// ── Kleur & icoon ─────────────────────────────────────────────────────────────
function waveColor(h) {
  if (h === null || isNaN(h)) return '#3d5167';
  if (h < 0.5)  return '#22c55e';
  if (h < 1.0)  return '#84cc16';
  if (h < 1.5)  return '#eab308';
  if (h < 2.5)  return '#f97316';
  if (h < 4.0)  return '#ef4444';
  return '#b91c1c';
}

// Schaalfactor op basis van zoomniveau
function iconScale() {
  const z = map.getZoom();
  return Math.max(0.45, Math.min(1.0, z / 7));
}

function makeIcon(h) {
  const sc    = iconScale();
  const color = waveColor(h);
  const base  = h !== null ? Math.max(34, Math.min(58, 34 + h * 7)) : 34;
  const size  = Math.round(base * sc);
  const ht    = Math.round(size * 0.58);
  const fs    = Math.max(7, Math.round(10 * sc));
  const label = h !== null ? h.toFixed(1) : '–';
  const r     = Math.max(2, Math.round(5 * sc));
  return L.divIcon({
    className:   '',
    iconSize:    [size, ht],
    iconAnchor:  [size / 2, ht / 2],
    popupAnchor: [0, -(ht / 2 + 6)],
    html: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${ht}">
      <rect x="1" y="1" width="${size-2}" height="${ht-2}" rx="${r}"
        fill="${color}" fill-opacity="0.88"/>
      <rect x="1" y="1" width="${size-2}" height="${ht-2}" rx="${r}"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="${size/2}" y="${ht/2+3.8}" text-anchor="middle"
        font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="${fs}"
        font-weight="700" fill="white">${label}</text>
    </svg>`,
  });
}

// ── Temperatuurkaart ──────────────────────────────────────────────────────────
function tempColor(t) {
  if (t === null || isNaN(t)) return '#3d5167';
  if (t < 5)  return '#93c5fd';
  if (t < 8)  return '#60a5fa';
  if (t < 11) return '#34d399';
  if (t < 14) return '#fbbf24';
  if (t < 18) return '#f97316';
  return '#ef4444';
}

function makeTempIcon(t) {
  const sc    = iconScale();
  const color = tempColor(t);
  const w = Math.round(38 * sc), ht = Math.round(22 * sc);
  const fs = Math.max(7, Math.round(10 * sc));
  const label = t !== null ? t.toFixed(1) : '–';
  return L.divIcon({
    className:   '',
    iconSize:    [w, ht],
    iconAnchor:  [w / 2, ht / 2],
    popupAnchor: [0, -(ht / 2 + 6)],
    html: `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${ht}">
      <rect x="1" y="1" width="${w-2}" height="${ht-2}" rx="${Math.max(2,Math.round(5*sc))}"
        fill="${color}" fill-opacity="0.88"/>
      <rect x="1" y="1" width="${w-2}" height="${ht-2}" rx="${Math.max(2,Math.round(5*sc))}"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="${w/2}" y="${ht/2+3.8}" text-anchor="middle"
        font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="${fs}"
        font-weight="700" fill="white">${label}</text>
    </svg>`,
  });
}

const _tempGroup  = L.layerGroup();
const _windGroup  = L.layerGroup();
const _zichtGroup = L.layerGroup();
const _metarGroup = L.layerGroup();

function clearTempMarkers()  { _tempGroup.clearLayers();  map.removeLayer(_tempGroup); }
function clearWindMarkers()  { _windGroup.clearLayers();  map.removeLayer(_windGroup); }
function clearZichtMarkers() { _zichtGroup.clearLayers(); map.removeLayer(_zichtGroup); }
function clearMetarMarkers() { _metarGroup.clearLayers(); map.removeLayer(_metarGroup); }

function renderTempMarkers(geojson) {
  _lastTempGeoJSON = geojson;
  _tempGroup.clearLayers();
  (geojson.features || []).forEach(f => {
    const [lon, lat] = f.geometry.coordinates;
    const p = f.properties;
    const t = p.temp_c;
    const marker = L.marker([lat, lon], { icon: makeTempIcon(t) });
    marker.on('click', () => openTempChart(p.code, p.naam || p.code, t, p.tijdstip));
    _tempGroup.addLayer(marker);
  });
  if (activeLayer === 'temp') { _hideAllGroups(); _tempGroup.addTo(map); }
}

function tempUrl()            { return `${PROXY_URL}/api/temp`; }
function tempHistoryUrl(code) { return `${PROXY_URL}/api/temp-history?code=${encodeURIComponent(code)}`; }

// ── Windsnelheid ──────────────────────────────────────────────────────────────

// w altijd in m/s intern; conversie + Bft alleen voor weergave
function msToBft(w) {
  if (w === null || w === undefined) return null;
  if (w < 0.3)  return 0;
  if (w < 1.6)  return 1;
  if (w < 3.4)  return 2;
  if (w < 5.5)  return 3;
  if (w < 8.0)  return 4;
  if (w < 10.8) return 5;
  if (w < 13.9) return 6;
  if (w < 17.2) return 7;
  if (w < 20.8) return 8;
  if (w < 24.5) return 9;
  if (w < 28.5) return 10;
  if (w < 32.7) return 11;
  return 12;
}
function msToKt(w) { return w !== null && w !== undefined ? w * 1.94384 : null; }

function windColor(w) {   // w in m/s
  if (w === null || isNaN(w)) return '#3d5167';
  if (w < 3.4)  return '#22c55e';   // Bft 0-2
  if (w < 5.5)  return '#84cc16';   // Bft 3
  if (w < 8.0)  return '#eab308';   // Bft 4-5
  if (w < 10.8) return '#f97316';   // Bft 6
  if (w < 13.9) return '#ef4444';   // Bft 7-8
  return '#7f1d1d';                  // Bft 9+
}

function degToCompass(deg) {
  if (deg === null || deg === undefined) return null;
  const dirs = ['N','NO','O','ZO','Z','ZW','W','NW'];
  return dirs[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
}

function makeWindIcon(w, dir) {
  const sc      = iconScale();
  const color   = windColor(w);
  const kt      = msToKt(w);
  const bft     = msToBft(w);
  const compass = degToCompass(dir);
  const hasDir  = compass !== null;

  // Hoofdtekst: bijv "17 kt"  Subtekst: "(Bft 4)"
  const speedLabel = kt !== null ? Math.round(kt) + ' kt' : '–';
  const bftLabel   = bft !== null ? `${bft} bft` : '';

  // Iets groter dan voorheen: basisblok 30px hoog, breed genoeg voor alle tekst
  const ht   = Math.round(30 * sc);
  const dirW = hasDir ? Math.round(24 * sc) : 0;
  const valW = Math.round(52 * sc);   // snelheid + bft sectie
  const ww   = dirW + valW;
  const fsMain = Math.max(8,  Math.round(11 * sc));
  const fsSub  = Math.max(6,  Math.round(8  * sc));
  const rx   = Math.max(2, Math.round(5 * sc));

  const dirSection = hasDir ? `
    <text x="${dirW / 2}" y="${ht * 0.62}" text-anchor="middle"
      font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="${fsMain}"
      font-weight="700" fill="white">${compass}</text>
    <line x1="${dirW}" y1="3" x2="${dirW}" y2="${ht - 3}"
      stroke="rgba(255,255,255,0.35)" stroke-width="1"/>` : '';

  const cx = dirW + valW / 2;
  const valSection = `
    <text x="${cx}" y="${ht * 0.50}" text-anchor="middle" dominant-baseline="middle"
      font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="${fsMain}"
      font-weight="700" fill="white">${speedLabel}</text>
    <text x="${cx}" y="${ht * 0.85}" text-anchor="middle" dominant-baseline="middle"
      font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="${fsSub}"
      font-weight="400" fill="rgba(255,255,255,0.75)">${bftLabel}</text>`;

  return L.divIcon({
    className:   '',
    iconSize:    [ww, ht],
    iconAnchor:  [ww / 2, ht / 2],
    popupAnchor: [0, -(ht / 2 + 6)],
    html: `<svg xmlns="http://www.w3.org/2000/svg" width="${ww}" height="${ht}">
      <rect x="1" y="1" width="${ww-2}" height="${ht-2}" rx="${rx}"
        fill="${color}" fill-opacity="0.88"/>
      <rect x="1" y="1" width="${ww-2}" height="${ht-2}" rx="${rx}"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      ${dirSection}${valSection}
    </svg>`,
  });
}


function renderWindMarkers(geojson) {
  _lastWindGeoJSON = geojson;
  _windGroup.clearLayers();
  (geojson.features || []).forEach(f => {
    const [lon, lat] = f.geometry.coordinates;
    const p = f.properties;
    const w = p.wind_ms;
    const marker = L.marker([lat, lon], { icon: makeWindIcon(w, p.wind_dir) });
    marker.on('click', () => openWindChart(p.code, p.naam || p.code, w, p.tijdstip));
    _windGroup.addLayer(marker);
  });
  if (activeLayer === 'wind') { _hideAllGroups(); _windGroup.addTo(map); }
}

function windUrl()            { return `${PROXY_URL}/api/wind`; }
function windHistoryUrl(code) { return `${PROXY_URL}/api/wind-history?code=${encodeURIComponent(code)}`; }

async function fetchWindData() {
  if (activeLayer === 'wind') setStatus('loading', 'laden…');
  try {
    const resp = await fetchWithTimeout(windUrl());
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const geojson = await resp.json();
    renderWindMarkers(geojson);
    _markFetched('wind');
    if (activeLayer === 'wind') {
      const opgehaald = geojson.opgehaald
        ? new Date(geojson.opgehaald).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })
        : new Date().toLocaleTimeString('nl-NL');
      setStatus('ok', `${geojson.aantalStations} stations · ${opgehaald}`);
    }
  } catch (err) {
    console.error(err);
    if (activeLayer === 'wind') setStatus('error', 'Opnieuw laden…');
    setTimeout(() => { if (activeLayer === 'wind') fetchWindData().then(startCountdown); }, 5000);
  }
}

// ── Zicht ─────────────────────────────────────────────────────────────────────
function zichtColor(v) {   // v in km
  if (v === null || isNaN(v)) return '#3d5167';
  if (v < 1)   return '#7f1d1d';
  if (v < 4)   return '#ef4444';
  if (v < 10)  return '#f97316';
  if (v < 20)  return '#eab308';
  if (v < 40)  return '#84cc16';
  return '#22c55e';
}

function makeZichtIcon(v) {
  const sc    = iconScale();
  const color = zichtColor(v);
  const size  = Math.round(46 * sc);
  const ht    = Math.round(size * 0.58);
  const fs    = Math.max(7, Math.round(10 * sc));
  const r     = Math.max(2, Math.round(5 * sc));
  const label = v !== null ? (v >= 10 ? Math.round(v) + ' km' : v.toFixed(1) + ' km') : '–';
  return L.divIcon({
    className: '',
    iconSize:    [size, ht],
    iconAnchor:  [size / 2, ht / 2],
    popupAnchor: [0, -(ht / 2 + 6)],
    html: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${ht}">
      <rect x="1" y="1" width="${size-2}" height="${ht-2}" rx="${r}"
        fill="${color}" fill-opacity="0.88"/>
      <rect x="1" y="1" width="${size-2}" height="${ht-2}" rx="${r}"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="${size/2}" y="${ht/2+3.8}" text-anchor="middle"
        font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="${fs}"
        font-weight="600" fill="#fff" paint-order="stroke"
        stroke="#0004" stroke-width="2">${label}</text>
    </svg>`,
  });
}


function renderZichtMarkers(geojson) {
  _lastZichtGeoJSON = geojson;
  _zichtGroup.clearLayers();
  (geojson.features || []).forEach(f => {
    const [lon, lat] = f.geometry.coordinates;
    const v = f.properties.vv;
    const marker = L.marker([lat, lon], { icon: makeZichtIcon(v) });
    marker.bindTooltip(f.properties.stationname || f.properties.naam || '', { direction: 'top', offset: [0, -4] });
    marker.on('click', () => openZichtChart(f.properties.code, f.properties.stationname || f.properties.naam || f.properties.code, v, f.properties.tijdstip));
    _zichtGroup.addLayer(marker);
  });
  if (activeLayer === 'zicht') { _hideAllGroups(); _zichtGroup.addTo(map); }
}

// ── METAR/TAF ─────────────────────────────────────────────────────────────────
function metarColor(fc) {
  if (fc === 'VFR')  return '#22c55e';
  if (fc === 'MVFR') return '#60a5fa';
  if (fc === 'IFR')  return '#ef4444';
  if (fc === 'LIFR') return '#a855f7';
  return '#64748b';
}

function makeMetarIcon(fc) {
  const sc    = Math.max(0.5, Math.min(1.4, (map.getZoom() - 2) / 6));
  const color = metarColor(fc);
  const r     = Math.round(7 * sc);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${r*2+4}" height="${r*2+4}">
    <circle cx="${r+2}" cy="${r+2}" r="${r}" fill="${color}" stroke="rgba(0,0,0,0.4)" stroke-width="1.2"/>
  </svg>`;
  return L.divIcon({ className: '', html: svg, iconSize: [r*2+4, r*2+4], iconAnchor: [r+2, r+2] });
}

let _lastMetarGeoJSON = null;

function renderMetarMarkers(geojson) {
  _lastMetarGeoJSON = geojson;
  _metarGroup.clearLayers();
  (geojson.features || []).forEach(f => {
    const [lon, lat] = f.geometry.coordinates;
    const p  = f.properties;
    const marker = L.marker([lat, lon], { icon: makeMetarIcon(p.fc) });
    marker.bindTooltip(`${p.icao} – ${p.naam}`, { direction: 'top', offset: [0, -4] });
    marker.on('click', () => openMetarPanel(p.icao, p.naam));
    _metarGroup.addLayer(marker);
  });
  if (activeLayer === 'metar') { _hideAllGroups(); _metarGroup.addTo(map); }
}

// ── Bliksem (SSE-relay via proxy → geen CORS/origin issues) ──────────────────
const BLIKSEM_MAX_AGE_MS = 60 * 60 * 1000;
const _BLIKSEM_LS_KEY    = 'zeedata_bliksem_v1';

let _bliksemLayers  = [];
let _bliksemSse     = null;
let _bliksemColorT  = null;
let _bliksemKnownTs = new Set();

const _bliksemRenderer = L.canvas({ padding: 0.5 });
const _bliksemGroup    = L.layerGroup();

function _bliksemColor(ageMs) {
  if (ageMs <   5 * 60000) return '#ffdd00';   // < 5 min  — geel
  if (ageMs <  15 * 60000) return '#ff8800';   // < 15 min — oranje
  if (ageMs <  30 * 60000) return '#ef4444';   // < 30 min — rood
  return '#666666';                             // < 60 min — grijs
}
function _bliksemRadius(ageMs) {
  if (ageMs <  5 * 60000) return 5;
  if (ageMs < 15 * 60000) return 4;
  if (ageMs < 30 * 60000) return 3;
  return 2;
}
function _bliksemOpacity(ageMs) {
  if (ageMs <  5 * 60000) return 0.95;
  if (ageMs < 15 * 60000) return 0.80;
  if (ageMs < 30 * 60000) return 0.60;
  return 0.35;
}
function _bliksemStroke(ageMs) {
  // Zwarte rand alleen om de gele bol (< 5 min)
  return ageMs < 5 * 60000 ? { color: '#000000', weight: 1 } : { color: '#000000', weight: 0 };
}

function clearBliksemMarkers() {
  _bliksemGroup.clearLayers();
  _bliksemLayers = [];
  _bliksemKnownTs.clear();
}

function _bliksemAddStrike(lat, lon, tsS) {
  const tsMs = Math.round(tsS * 1000);
  if (_bliksemKnownTs.has(tsMs)) return;
  _bliksemKnownTs.add(tsMs);
  const ageMs = Date.now() - tsMs;
  if (ageMs > BLIKSEM_MAX_AGE_MS || ageMs < -10000) return;
  const stroke = _bliksemStroke(ageMs);
  const m = L.circleMarker([lat, lon], {
    renderer:    _bliksemRenderer,
    radius:      _bliksemRadius(ageMs),
    color:       stroke.color,
    weight:      stroke.weight,
    fillColor:   _bliksemColor(ageMs),
    fillOpacity: _bliksemOpacity(ageMs),
    _tsMs:       tsMs,
  });
  _bliksemGroup.addLayer(m);
  _bliksemLayers.push(m);

  // Flash + persistent rood rondje voor verse strikes (< 5s oud)
  if (ageMs < 5000) {
    _bliksemFlash(lat, lon);
  }

  if (activeLayer === 'bliksem') {
    setStatus('ok', `${_bliksemLayers.length} bliksems · laatste 60 min`);
  }
}

function _bliksemFlash(lat, lon) {
  const el = document.createElement('div');
  el.className = 'bliksem-flash';
  const icon = L.divIcon({ className: '', html: el, iconSize: [22, 22], iconAnchor: [11, 11] });
  const m = L.marker([lat, lon], { icon, interactive: false, zIndexOffset: 1000 }).addTo(map);
  setTimeout(() => map.removeLayer(m), 1100);
}


// Sla huidige strikes op in localStorage zodat ze na pagina-herlaad hersteld worden
function _bliksemPersist() {
  try {
    const cutoff = Date.now() - BLIKSEM_MAX_AGE_MS;
    const strikes = _bliksemLayers
      .filter(m => m.options._tsMs >= cutoff)
      .map(m => { const ll = m.getLatLng(); return { lat: ll.lat, lon: ll.lng, ts: m.options._tsMs / 1000 }; });
    localStorage.setItem(_BLIKSEM_LS_KEY, JSON.stringify(strikes));
  } catch (_) {}
}

// Herstel strikes uit localStorage (na pagina-herlaad of tab-switch)
function _bliksemRestoreFromStorage() {
  try {
    const raw = localStorage.getItem(_BLIKSEM_LS_KEY);
    if (!raw) return 0;
    const strikes = JSON.parse(raw);
    const cutoffS = (Date.now() - BLIKSEM_MAX_AGE_MS) / 1000;
    let n = 0;
    for (const s of strikes) {
      if (s.ts >= cutoffS) { _bliksemAddStrike(s.lat, s.lon, s.ts); n++; }
    }
    return n;
  } catch (_) { return 0; }
}

function _bliksemRefreshColors() {
  if (activeLayer !== 'bliksem') return;
  const now    = Date.now();
  const cutoff = now - BLIKSEM_MAX_AGE_MS;
  _bliksemLayers.filter(m => m.options._tsMs < cutoff)
    .forEach(m => { _bliksemGroup.removeLayer(m); _bliksemKnownTs.delete(m.options._tsMs); });
  _bliksemLayers = _bliksemLayers.filter(m => m.options._tsMs >= cutoff);
  _bliksemLayers.forEach(m => {
    const age    = now - m.options._tsMs;
    const c      = _bliksemColor(age);
    const stroke = _bliksemStroke(age);
    m.setStyle({ color: stroke.color, weight: stroke.weight, fillColor: c, fillOpacity: _bliksemOpacity(age), radius: _bliksemRadius(age) });
  });
  _bliksemPersist();   // elke 15s opslaan
  setStatus('ok', `${_bliksemLayers.length} bliksems · laatste 60 min`);
}

let _bliksemRetryT  = null;
let _bliksemPollT   = null;   // polling interval als SSE fallback

function startBliksem() {
  // Verberg andere lagen (O(1) per groep)
  map.removeLayer(_waveGroup);
  map.removeLayer(_tempGroup);
  map.removeLayer(_windGroup);
  map.removeLayer(_zichtGroup);
  map.removeLayer(_metarGroup);

  // SSE loopt al op de achtergrond → gewoon de groep tonen, geen re-fetch nodig
  if (_bliksemSse && _bliksemSse.readyState !== EventSource.CLOSED) {
    _bliksemGroup.addTo(map);
    setStatus('ok', `${_bliksemLayers.length} bliksems · laatste 60 min`);
    if (!_bliksemColorT) _bliksemColorT = setInterval(_bliksemRefreshColors, 15000);
    if (!_bliksemPollT)  _bliksemPollT  = setInterval(() => { if (activeLayer === 'bliksem') _bliksemPoll(); }, 20000);
    return;
  }

  // Eerste keer of na volledige stop: opnieuw opstarten
  clearBliksemMarkers();
  if (_bliksemRetryT) { clearTimeout(_bliksemRetryT);   _bliksemRetryT = null; }
  if (_bliksemPollT)  { clearInterval(_bliksemPollT);   _bliksemPollT  = null; }
  if (_bliksemColorT) { clearInterval(_bliksemColorT);  _bliksemColorT = null; }

  _bliksemGroup.addTo(map);

  // Herstel vorige sessie uit localStorage — direct zichtbaar zonder netwerkwachttijd
  const cached = _bliksemRestoreFromStorage();
  if (cached > 0) {
    setStatus('ok', `${_bliksemLayers.length} bliksems · laatste 60 min`);
    if (!_bliksemColorT) _bliksemColorT = setInterval(_bliksemRefreshColors, 15000);
  } else {
    setStatus('loading', 'Bliksemdata ophalen…');
  }

  _bliksemPoll().then((count) => {
    if (activeLayer !== 'bliksem') return;
    _bliksemPersist();   // meteen opslaan na eerste volledige poll
    _bliksemOpenSse();
    _bliksemPollT = setInterval(() => { if (activeLayer === 'bliksem') _bliksemPoll(); }, 20000);
    if (!_bliksemColorT) _bliksemColorT = setInterval(_bliksemRefreshColors, 15000);
    if (count === 0 && cached === 0) {
      setStatus('loading', 'Proxy opgestart · data laden…');
      _bliksemRetryT = setTimeout(() => { if (activeLayer === 'bliksem') _bliksemPoll(); }, 15000);
    }
  }).catch(() => {
    if (activeLayer !== 'bliksem') return;
    if (cached === 0) setStatus('loading', 'Proxy wekken · opnieuw proberen…');
    _bliksemRetryT = setTimeout(startBliksem, 8000);
  });
}

async function _bliksemPoll() {
  const r   = await fetch(`${PROXY_URL}/api/bliksem`, { cache: 'no-store' });
  const geo = await r.json();
  if (activeLayer !== 'bliksem') return;
  let n = 0;
  for (const f of (geo.features || [])) {
    const { ts } = f.properties;
    const [lon, lat] = f.geometry.coordinates;
    const before = _bliksemKnownTs.size;
    _bliksemAddStrike(lat, lon, ts);
    if (_bliksemKnownTs.size > before) n++;
  }
  console.log(`[bliksem] poll: ${geo.features?.length ?? 0} totaal, ${n} nieuw`);
  setStatus('ok', `${_bliksemLayers.length} bliksems · laatste 60 min`);
  _bliksemPersist();   // sla na elke poll op zodat herlaad volledig herstelt
  return n;
}

function _bliksemOpenSse() {
  if (_bliksemSse) { _bliksemSse.close(); _bliksemSse = null; }

  _bliksemSse = new EventSource(`${PROXY_URL}/api/bliksem-stream`);

  _bliksemSse.onopen = () => console.log('[bliksem] SSE verbonden');

  _bliksemSse.onmessage = (evt) => {
    if (activeLayer !== 'bliksem') return;
    let d;
    try { d = JSON.parse(evt.data); } catch { return; }
    if (d.batch) {
      for (const s of d.batch) _bliksemAddStrike(s.lat, s.lon, s.ts);
      _bliksemPersist();   // sla volledige batch direct op
      return;
    }
    if (d.lat !== undefined) _bliksemAddStrike(d.lat, d.lon, d.ts);
  };

  _bliksemSse.onerror = () => {
    console.warn('[bliksem] SSE fout — herverbinden over 5s');
    if (_bliksemSse) { _bliksemSse.close(); _bliksemSse = null; }
    if (_bliksemRetryT) clearTimeout(_bliksemRetryT);
    _bliksemRetryT = setTimeout(_bliksemOpenSse, 5000);
  };
}

function stopBliksem() {
  if (_bliksemRetryT) { clearTimeout(_bliksemRetryT);   _bliksemRetryT = null; }
  if (_bliksemPollT)  { clearInterval(_bliksemPollT);   _bliksemPollT  = null; }
  if (_bliksemColorT) { clearInterval(_bliksemColorT);  _bliksemColorT = null; }
  if (_bliksemSse)    { _bliksemSse.close();            _bliksemSse    = null; }
  clearBliksemMarkers();
  map.removeLayer(_bliksemGroup);
}

function zichtUrl()            { return `${PROXY_URL}/api/visibility`; }
function zichtHistoryUrl(code) { return `${PROXY_URL}/api/visibility-history?code=${encodeURIComponent(code)}`; }

async function openZichtChart(code, naam, huidigVv, tijdstip) {
  _restoreChartPanel();
  panel.classList.add('open');
  setTimeout(() => map.invalidateSize({ pan: false }), 320);

  document.getElementById('chart-naam').textContent      = naam || code;
  document.getElementById('chart-subtitle').textContent  = 'Zicht afgelopen 24 uur';
  document.getElementById('chart-hm0-label').textContent = 'km';
  const color = zichtColor(huidigVv);
  document.getElementById('chart-hm0').textContent  = huidigVv !== null ? huidigVv.toFixed(1) : '–';
  document.getElementById('chart-hm0').style.color  = color;
  document.getElementById('chart-time').textContent = formatTijdstip(tijdstip);

  loadingEl.textContent   = 'Geschiedenis laden…';
  loadingEl.style.display = 'flex';
  canvasEl.style.display  = 'none';
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  try {
    const resp = await fetch(zichtHistoryUrl(code), { cache: 'no-store' });

    const json = await resp.json();
    if (!json.data || json.data.length === 0) {
      loadingEl.textContent = 'Geen historische data beschikbaar.';
      return;
    }

    loadingEl.style.display = 'none';
    canvasEl.style.display  = 'block';

    const labels = json.data.map(d => new Date(d.t));
    const values = json.data.map(d => d.v);
    const maxVal = Math.max(...values);

    const opts = CHART_OPTS(color);
    opts.plugins.tooltip.callbacks = {
      title: items => new Date(items[0].parsed.x).toLocaleString('nl-NL', {
        day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit',
        timeZone: 'Europe/Amsterdam',
      }),
      label: item => ` ${item.parsed.y.toFixed(1)} km`,
    };
    opts.scales.y.min              = 0;
    opts.scales.y.suggestedMax     = Math.max(maxVal * 1.1, 10);
    opts.scales.y.ticks.callback   = v => v.toFixed(0) + ' km';

    chartInstance = new Chart(canvasEl, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: values, borderColor: color,
          backgroundColor: color + '18',
          borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,
          fill: true, tension: 0.35,
        }],
      },
      options: opts,
    });
  } catch (err) {
    console.error(err);
    loadingEl.textContent = 'Fout bij laden: ' + err.message;
  }
}

  try {
    const resp = await fetch(windHistoryUrl(code), { cache: 'no-store' });

    const json = await resp.json();
    if (!json.data || json.data.length === 0) {
      loadingEl.textContent = 'Geen historische data beschikbaar.';
      return;
    }
    loadingEl.style.display = 'none';
    canvasEl.style.display  = 'block';

    const labels = json.data.map(d => new Date(d.t));
    const values = json.data.map(d => Math.round(msToKt(d.v) * 10) / 10);  // m/s → kt
    const maxVal = Math.max(...values);

    // Windrichting dataset (rechter as)
    const dirPoints = (json.dir_data || []).map(d => ({ x: new Date(d.t), y: d.v }));
    const dirColor  = 'rgba(148,163,184,0.85)';

    const opts = CHART_OPTS(color);
    opts.plugins.tooltip.callbacks = {
      title: items => new Date(items[0].parsed.x).toLocaleString('nl-NL', {
        day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit',
        timeZone: 'Europe/Amsterdam',
      }),
      label: item => {
        if (item.dataset.yAxisID === 'yDir') {
          const deg = item.parsed.y;
          const dirs = ['N','NO','O','ZO','Z','ZW','W','NW'];
          const compass = dirs[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
          return ` ${compass} (${deg}°)`;
        }
        const kt = item.parsed.y;
        const bft = msToBft(kt / 1.94384);
        return ` ${kt.toFixed(1)} kt (Bft ${bft})`;
      },
    };
    opts.scales.y.min             = 0;
    opts.scales.y.suggestedMax    = Math.max(maxVal * 1.2, 10);
    opts.scales.y.ticks.callback  = v => Math.round(v) + ' kt';

    // Rechter as voor windrichting (0–360°)
    opts.scales.yDir = {
      type: 'linear',
      position: 'right',
      min: 0, max: 360,
      grid: { drawOnChartArea: false },
      ticks: {
        color: dirColor,
        font: { size: 10 },
        stepSize: 90,
        callback: v => ({ 0:'N', 90:'O', 180:'Z', 270:'W', 360:'N' }[v] ?? ''),
      },
      border: { color: dirColor },
    };

    const datasets = [{
      label: 'Windsnelheid',
      yAxisID: 'y',
      data: values, borderColor: color,
      backgroundColor: color + '18',
      borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,
      fill: true, tension: 0.35,
    }];
    if (dirPoints.length > 0) {

async function fetchWithTimeout(url, timeoutMs = 90000) {
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const resp = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
    return resp;
  } finally {
    clearTimeout(tid);
  }
}

// Achtergrond-prefetch: bouw laaggroepen stilletjes voor zodat tabwisseling instant is.
// Herprobeert automatisch tot de data beschikbaar is (proxy kan nog opstarten).
function _bgPrefetch(url, isFreshFn, buildFn, retryMs) {
  if (isFreshFn()) return;
  fetch(url, { cache: 'no-store' })
    .then(r => r.json())
    .then(geo => {
      if (geo.laden || !geo.features?.length) {
        setTimeout(() => _bgPrefetch(url, isFreshFn, buildFn, retryMs), retryMs);
      } else {
        buildFn(geo);
      }
    })
    .catch(() => setTimeout(() => _bgPrefetch(url, isFreshFn, buildFn, retryMs), retryMs * 2));
}

function _bgBuildTemp(geo) {
  _lastTempGeoJSON = geo;
  _tempGroup.clearLayers();
  (geo.features || []).forEach(f => {
    const [lon, lat] = f.geometry.coordinates;

    _tempGroup.addLayer(marker);
  });
  _markFetched('temp');
  if (activeLayer === 'temp') { _hideAllGroups(); _tempGroup.addTo(map); _statusFromGeoJSON(geo); }
}

const RADAR_LAYER = 'Reflectivity';
const RADAR_FRAMES = 12;   // 1 uur, elke 5 minuten

// Bounding box NL (KNMI)
const RADAR_BOUNDS = [[48.8, 1.5], [53.9, 9.0]];

// RainViewer (Europa)
const RV_API = 'https://api.rainviewer.com/public/weather-maps.json';

let _radarMap       = null;
let _radarWmsLayer  = null;
let _radarFrames    = [];   // KNMI: array van ISO-tijdstrings (oud → nieuw)
let _radarFrameIdx  = 0;
let _radarPlaying   = true;
let _radarAnimT     = null;
let _radarRefreshT  = null;
let _radarSource    = 'europe';

// RainViewer state
let _rvFrames       = [];   // {time, path} per frame (oud → nieuw)
let _rvHost         = 'https://tilecache.rainviewer.com';
let _rvLayers       = [];   // één tile-laag per frame, allemaal op de kaart
let _rvCurrentIdx   = -1;
const _rvDone       = new WeakSet(); // bijhouden welke tiles al verwerkt zijn

// Verwijder grijze pixels (lage saturatie) per tile via canvas
function _rvStripGrey(img) {
  if (_rvDone.has(img)) return;
  _rvDone.add(img);
  const w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h) return;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.drawImage(img, 0, 0);
  try {
    const id = ctx.getImageData(0, 0, w, h);
    const d  = id.data;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i+3] === 0) continue;
      const mx = Math.max(d[i], d[i+1], d[i+2]);
      const mn = Math.min(d[i], d[i+1], d[i+2]);
      // saturatie < 0.25 → grijs → transparant
      if (mx === 0 || (mx - mn) / mx < 0.25) d[i+3] = 0;
    }
    ctx.putImageData(id, 0, 0);
    img.src = cv.toDataURL('image/png');
  } catch (_) { /* CORS-fout: gebruik origineel */ }
}

// ── RainViewer (Europa) ───────────────────────────────────────────────────────
// Haal frames op en bouw alle tile-lagen IN ÉÉN KEER — wisselen = alleen opacity
async function _rvBuildLayers() {
  try {
    const resp = await fetch(RV_API);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    _rvHost   = data.host || 'https://tilecache.rainviewer.com';
    _rvFrames = (data.radar && data.radar.past) ? data.radar.past : [];
  } catch (e) {
    console.error('[RV] fetch mislukt:', e);
    _rvFrames = [];
    return;
  }

  // Verwijder eventuele oude lagen
  _rvLayers.forEach(l => _radarMap && _radarMap.removeLayer(l));
  _rvLayers     = [];
  _rvCurrentIdx = -1;

  // Maak voor elk frame een tile-laag (verborgen) en voeg toe aan kaart
  _rvFrames.forEach(frame => {
    const url   = `${_rvHost}${frame.path}/512/{z}/{x}/{y}/4/1_0.png`;
    const layer = L.tileLayer(url, {
      opacity:        0,
      zIndex:         10,
      className:      'rv-radar-frame',
      keepBuffer:     2,
      updateWhenIdle: false,
      crossOrigin:    'anonymous',
      attribution:    '&copy; <a href="https://rainviewer.com">RainViewer</a>',
    });
    layer.on('tileload', e => _rvStripGrey(e.tile));
    if (_radarMap) layer.addTo(_radarMap);
    _rvLayers.push(layer);
  });
}

function _rvShowFrame(idx) {
  if (!_rvLayers.length || idx < 0 || idx >= _rvLayers.length) return;

  // Verberg huidig frame
  if (_rvCurrentIdx >= 0 && _rvCurrentIdx < _rvLayers.length)
    _rvLayers[_rvCurrentIdx].setOpacity(0);

  _rvCurrentIdx = idx;
  _radarFrameIdx = idx;
  _rvLayers[idx].setOpacity(0.75);

  document.getElementById('radar-slider').value = idx;
  const d = new Date(_rvFrames[idx].time * 1000);
  document.getElementById('radar-time').textContent =
    d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Amsterdam' });

  if (activeLayer === 'radar') {
    const latest = new Date(_rvFrames[_rvFrames.length - 1].time * 1000);
    setStatus('ok', `Neerslag Europa · tot ${latest.toLocaleTimeString('nl-NL', { hour:'2-digit', minute:'2-digit', timeZone:'Europe/Amsterdam' })}`);
  }
}

function _rvRemoveLayer() {
  _rvLayers.forEach(l => _radarMap && _radarMap.removeLayer(l));
  _rvLayers     = [];
  _rvCurrentIdx = -1;
}

function _radarSetSource(src) {
  if (_radarSource === src) return;
  _radarSource = src;

  document.getElementById('radar-src-knmi').classList.toggle('active', src === 'knmi');
  document.getElementById('radar-src-europe').classList.toggle('active', src === 'europe');

  _radarPauseAnim();

  if (src === 'knmi') {
    _rvRemoveLayer();
    document.getElementById('radar-source').textContent = 'Bron: KNMI';
    _radarUpdateLegend();
    _radarMap.setView([52.1, 5.3], 7, { animate: true });
    _radarFrames = _radarBuildFrames();
    document.getElementById('radar-slider').max = RADAR_FRAMES - 1;
    _radarShowFrame(RADAR_FRAMES - 1);
    _radarStartAnim();
  } else {
    // Verwijder KNMI-laag definitief — ook als img.onload nog loopt
    if (_radarWmsLayer) { _radarMap.removeLayer(_radarWmsLayer); _radarWmsLayer = null; }
    document.getElementById('radar-source').textContent = 'Bron: RainViewer';
    _radarUpdateLegend();
    setStatus('loading', 'Europa radar laden…');
    _radarMap.setView([52.0, 8.0], 5, { animate: true });
    _rvFetchFrames().then(() => {
      if (_radarSource !== 'europe') return; // gebruiker heeft al terug gewisseld
      if (!_rvFrames.length) { setStatus('error', 'RainViewer niet beschikbaar'); return; }
      document.getElementById('radar-slider').max = _rvFrames.length - 1;
      _rvShowFrame(_rvFrames.length - 1);
      _radarStartAnim();
    });
  }
}

// ── KNMI helpers ─────────────────────────────────────────────────────────────
function _radarRoundToFive(date) {
  const d = new Date(date);
  d.setUTCSeconds(0, 0);
  d.setUTCMinutes(Math.floor(d.getUTCMinutes() / 5) * 5);
  return d;
}

function _radarBuildFrames() {
  const latest = _radarRoundToFive(new Date());
  // Laatste frame is 10 min geleden (WMS heeft vertraging)
  latest.setUTCMinutes(latest.getUTCMinutes() - 10);
  const frames = [];
  for (let i = RADAR_FRAMES - 1; i >= 0; i--) {
    const t = new Date(latest);
    t.setUTCMinutes(t.getUTCMinutes() - i * 5);
    frames.push(t.toISOString().replace(/\.\d{3}Z$/, 'Z'));
  }
  return frames;
}

function _radarWmsUrl(timeIso) {
  const params = new URLSearchParams({
    DATASET:     'radar_reflectivity_composites',
    SERVICE:     'WMS',
    REQUEST:     'GetMap',
    VERSION:     '1.3.0',
    LAYERS:      RADAR_LAYER,
    STYLES:      'radarReflectivity_transparant/nearest',
    CRS:         'EPSG:4326',
    BBOX:        '48.8,1.5,53.9,9.0',
    WIDTH:       '800',
    HEIGHT:      '600',
    FORMAT:      'image/png',
    TRANSPARENT: 'TRUE',
    TIME:        timeIso,
  });
  return `${RADAR_WMS}?${params}`;
}

function _radarShowFrame(idx) {
  if (!_radarMap || !_radarFrames.length) return;
  _radarFrameIdx = idx;

  const timeIso = _radarFrames[idx];
  const url     = _radarWmsUrl(timeIso);

  // Slider en tijdlabel alvast bijwerken
  document.getElementById('radar-slider').value = idx;
  const d = new Date(timeIso);
  document.getElementById('radar-time').textContent =
    d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Amsterdam' });

  // Laad de afbeelding volledig VOORDAT de overlay aan de kaart wordt toegevoegd.
  // Zo is er nooit een blauw placeholder-vlak zichtbaar.
  const prevLayer = _radarWmsLayer;
  const img = new Image();
  img.onload = () => {
    if (!_radarMap || _radarSource !== 'knmi') return;
    _radarWmsLayer = L.imageOverlay(url, RADAR_BOUNDS, { opacity: 0.85, zIndex: 10 }).addTo(_radarMap);
    if (prevLayer) _radarMap.removeLayer(prevLayer);
    const latest = new Date(_radarFrames[_radarFrames.length - 1]);
    const latestStr = latest.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Amsterdam' });
    setStatus('ok', `Neerslag radar · tot ${latestStr}`);
  };
  img.onerror = () => { /* tijdstip overslaan, huidige frame behouden */ };
  img.src = url;
}

function _radarStep() {
  if (!_rvLayers.length) return;
  _rvShowFrame((_rvCurrentIdx + 1) % _rvLayers.length);
}

function _radarStartAnim() {
  if (_radarAnimT) return;
  _radarAnimT = setInterval(_radarStep, RADAR_INTERVAL_MS);
  _radarPlaying = true;
  document.getElementById('radar-play-icon').innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
}

function _radarPauseAnim() {
  if (_radarAnimT) { clearInterval(_radarAnimT); _radarAnimT = null; }
  _radarPlaying = false;
  document.getElementById('radar-play-icon').innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
}

const _LEGEND_RV = [
  { color: '#00d4d4', label: 'Licht' },
  { color: '#00c800', label: 'Zwak' },
  { color: '#ffff00', label: 'Matig' },
  { color: '#ff9000', label: 'Zwaar' },
  { color: '#ff0000', label: 'Hevig' },
  { color: '#cc00cc', label: 'Extreem' },
];

function _radarUpdateLegend(div) {
  div = div || document.getElementById('radar-legend-div');
  if (!div) return;
  div.innerHTML = '<h4>Neerslag</h4>' +
    _LEGEND_RV.map(i => `<div class="radar-legend-row"><div class="radar-legend-swatch" style="background:${i.color}"></div>${i.label}</div>`).join('');
}

function startRadar() {
  setStatus('loading', 'Radar laden…');

  // Kaart éénmalig aanmaken
  if (!_radarMap) {
    _radarMap = L.map('radar-map', {
      center:          [52.0, 5.0],
      zoom:            5,
      minZoom:         4,
      zoomControl:     true,
      scrollWheelZoom: true,
      doubleClickZoom: true,
      touchZoom:       true,
      dragging:        true,
      keyboard:        true,
      boxZoom:         true,
    });
    _radarMap.zoomControl.setPosition('topright');

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd', maxZoom: 12,
    }).addTo(_radarMap);

    // Legenda
    const radarLegend = L.control({ position: 'bottomright' });
    radarLegend.onAdd = () => {
      const div = L.DomUtil.create('div', 'radar-legend');
      div.id = 'radar-legend-div';
      _radarUpdateLegend(div);
      return div;
    };
    radarLegend.addTo(_radarMap);

    // Play/pause knop
    document.getElementById('radar-play').addEventListener('click', () => {
      if (_radarPlaying) _radarPauseAnim(); else _radarStartAnim();
    });

    // Slider: dispatch naar juiste bron
    document.getElementById('radar-slider').addEventListener('input', e => {
      _radarPauseAnim();
      const idx = parseInt(e.target.value);
      if (_radarSource === 'europe') _rvShowFrame(idx); else _radarShowFrame(idx);
    });
  }

  // Alle frame-lagen bouwen (tiles laden parallel op de achtergrond)
  setStatus('loading', 'Radar laden…');
  _rvBuildLayers().then(() => {
    if (!_rvLayers.length) { setStatus('error', 'Radar niet beschikbaar'); return; }
    document.getElementById('radar-slider').max = _rvLayers.length - 1;
    _rvShowFrame(_rvLayers.length - 1);
    _radarStartAnim();
  });

  // Elke 5 minuten lagen verversen
  if (_radarRefreshT) clearInterval(_radarRefreshT);
  _radarRefreshT = setInterval(() => {
    if (activeLayer !== 'radar') return;
    _rvBuildLayers().then(() => {
      if (_rvLayers.length) _rvShowFrame(_rvLayers.length - 1);
    });
  }, 5 * 60 * 1000);
}

function stopRadar() {
  _radarPauseAnim();
  if (_radarRefreshT) { clearInterval(_radarRefreshT); _radarRefreshT = null; }
}
</script>
